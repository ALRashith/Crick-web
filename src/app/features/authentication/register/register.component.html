<main class="authentication-page">
  <section class="authentication-panel">
    <p class="eyebrow">Cric Admin</p>
    <h1>Create account</h1>
    <p class="intro">Set up an account to manage your cricket operations.</p>

    <form [formGroup]="registerForm" (ngSubmit)="submit()">
      <label for="name">Name</label>
      <input id="name" type="text" formControlName="name" autocomplete="name" />

      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />

      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" autocomplete="new-password" />

      <button type="submit">Register</button>
    </form>
  </section>
</main>
