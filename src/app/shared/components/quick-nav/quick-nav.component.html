<nav class="quick-nav" aria-label="Main cricket sections">
  <button
    class="nav-card"
    *ngFor="let item of items"
    [class.active]="item === selectedItem"
    type="button"
    (click)="select(item)">

    <span class="nav-icon" [ngClass]="item.accent">
      <ng-container [ngSwitch]="item.icon">
        <svg *ngSwitchCase="'chart'" viewBox="0 0 24 24">
          <path d="M4 19V10M10 19V6M16 19V12M22 19V3" />
          <path d="M2 19h21" />
          <path d="m3 8 5-4 6 4 7-6" />
        </svg>

        <svg *ngSwitchCase="'trophy'" viewBox="0 0 24 24">
          <path d="M8 4h8v5a4 4 0 0 1-8 0V4Z" />
          <path d="M8 6H4v2a4 4 0 0 0 4 4M16 6h4v2a4 4 0 0 1-4 4" />
          <path d="M12 13v5M8 21h8M9 18h6" />
        </svg>

        <svg *ngSwitchCase="'calendar'" viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="16" rx="2" />
          <path d="M16 3v4M8 3v4M3 10h18" />
          <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01" />
        </svg>
      </ng-container>
    </span>

    <span class="nav-label">{{ item.label }}</span>
    <span class="arrow">→</span>
  </button>
</nav>
